name: Build Elyxia EB Desktop (Windows & macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release (.zip)
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Elyxia_EB_Windows.zip
        shell: pwsh

      - name: Archive Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Elyxia_EB_Windows_Release
          path: Elyxia_EB_Windows.zip

  build-macos:
    name: Build macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Package macOS DMG & ZIP
        run: |
          cd build/macos/Build/Products/Release
          # 1. Utilisation de ditto pour préserver scrupuleusement les symlinks et métadonnées Apple
          ditto -c -k --sequesterRsrc --keepParent elyxia_eb.app Elyxia_EB_macOS.zip
          # 2. Création de l'image disque .DMG prête à installer par glisser-déposer
          hdiutil create -volname "Elyxia EB" -srcfolder elyxia_eb.app -ov -format UDZO Elyxia_EB_macOS.dmg

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: Elyxia_EB_macOS_DMG
          path: build/macos/Build/Products/Release/Elyxia_EB_macOS.dmg

      - name: Upload macOS Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Elyxia_EB_macOS_ZIP
          path: build/macos/Build/Products/Release/Elyxia_EB_macOS.zip
